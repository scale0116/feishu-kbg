name: review
on:
  schedule:
    - cron: '30 14 * * 0'   # UTC周日14:30 = 北京周日22:30
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 生成本周复盘
        run: python -m kbg.review
      - name: 提交复盘MD
        run: |
          git config user.name "kbg-bot"
          git config user.email "kbg-bot@users.noreply.github.com"
          git add state.yaml MD备份/ || true
          git diff --cached --quiet || git commit -m "weekly review $(date -u +%FT%TZ)"
          git push
