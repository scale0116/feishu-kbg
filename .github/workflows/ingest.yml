name: ingest
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'   # cron仅作复活器（GitHub高峰期常跳过），正常节奏靠自续链
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ingest-chain
  cancel-in-progress: true   # 同一时刻只允许一轮入库，防止重复消费
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # 工作本身1-3分钟，其余是自续链的睡眠时间
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 拉取私有数据
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.DATA_PAT }}@github.com/scale0116/personal-knowledge-base.git data
          cp data/config.yaml data/state.yaml .
      - name: 跑一轮入库
        run: python -m kbg.ingest --once
      - name: 增量导出MD语料
        run: python -m kbg.export_md
      - name: 失败时飞书告警
        if: failure()
        env:
          ALERT_PAT: ${{ secrets.DATA_PAT }}
          ALERT_WF: ingest.yml
        run: python kbg/alert.py "ingest运行失败"
      - name: 数据回写
        if: always()
        run: |
          SZ=$(stat -c%s state.yaml 2>/dev/null || echo 0)
          if [ "$SZ" -lt 20000 ]; then
            echo "⚠ state.yaml仅${SZ}字节，疑似损坏，拒绝回写state（MD照常回写）"
          else
            cp config.yaml state.yaml data/
          fi
          mkdir -p data/MD备份
          cp -r MD备份/* data/MD备份/ 2>/dev/null || true
          cd data
          git config user.name kbg-bot
          git config user.email kbg-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 无变更; exit 0; }
          git commit -m "data update $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git pull --rebase origin main; then git push && break; fi
            git rebase --abort 2>/dev/null || true
            echo "push冲突，10秒后重试($i)"
            sleep 10
          done
      - name: 10-15分钟后自续链
        if: always()
        run: |
          SLEEP=$((600 + RANDOM % 300))
          echo "等待 ${SLEEP} 秒后触发下一轮（GitHub cron高峰期常跳过，节奏以自续链为准）"
          sleep $SLEEP
          for i in 1 2 3; do
            curl -s -X POST -H "Authorization: token ${{ secrets.DATA_PAT }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/scale0116/feishu-kbg/actions/workflows/ingest.yml/dispatches -d '{"ref":"main"}' && break
            sleep 15
          done
