name: ingest
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 拉取私有数据
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.DATA_PAT }}@github.com/scale0116/personal-knowledge-base.git data
          cp data/config.yaml data/state.yaml .
      - name: 跑一轮入库
        run: python -m kbg.ingest --once
      - name: 增量导出MD语料
        run: python -m kbg.export_md
      - name: 失败时飞书告警
        if: failure()
        run: python kbg/alert.py "ingest运行失败"
      - name: 数据回写
        run: |
          cp config.yaml state.yaml data/
          mkdir -p data/MD备份
          cp -r MD备份/* data/MD备份/ 2>/dev/null || true
          cd data
          git config user.name kbg-bot
          git config user.email kbg-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "data update $(date -u +%FT%TZ)"
          git push
