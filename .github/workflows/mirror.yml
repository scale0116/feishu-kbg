name: mirror
on:
  schedule:
    - cron: '0 13 * * *'    # UTC13:00 = 北京21:00 每日镜像
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 拉取私有数据
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.DATA_PAT }}@github.com/scale0116/personal-knowledge-base.git data
          cp data/config.yaml data/state.yaml .
      - name: 镜像记忆承载合集
        run: python -m kbg.mirror
      - name: 数据回写
        run: |
          cp state.yaml data/
          mkdir -p data/MD备份
          cp -r MD备份/* data/MD备份/ 2>/dev/null || true
          cd data
          git config user.name kbg-bot
          git config user.email kbg-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "mirror update $(date -u +%FT%TZ)"
          git push
